version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 OnlineApoinment.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password