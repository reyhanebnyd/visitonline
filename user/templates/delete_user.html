<!-- delete_user.html -->

{% extends "base.html" %}

{% block title %}Delete Account{% endblock %}

{% block content %}
<h3>Are you sure you want to delete your account?</h3>
<p>This action cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="button delete">Yes, delete my account</button>
</form>

<p>
    <a href="{% url 'update_user' %}" class="button back">Cancel</a>
</p>
{% endblock %}
