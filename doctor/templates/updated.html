{% extends "base.html" %}
{% block title %}Edit Doctor{% endblock  %}


{% block content %}

<h1>Edit Doctor: {{ doctor.name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'doctor-list' %}">Cancel</a>
</form>
{% endblock  %}
