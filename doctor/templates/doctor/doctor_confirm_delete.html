{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock  %}


{% block content %}
<h1>Are you sure you want to delete Doctor: {{ doctor.name }}?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'doctor-list' %}">Cancel</a>
</form>
{% endblock  %}
