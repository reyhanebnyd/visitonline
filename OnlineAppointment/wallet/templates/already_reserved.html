
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already Reserved</title>
</head>
<body>
    <h1>Reservation Already Exists</h1>
    <p>You already have a reservation for this doctor:</p>
    <p>Doctor: {{ reservation.id_D.name }}</p>
    <p>Time Slot: {{ reservation.accessdate }}</p>
    <p>Please cancel your existing reservation if you wish to book a new one.</p>
    <a href="{% url 'cancel_reservation' reservation.id %}">Cancel Reservation</a> 
</body>
</html>
